name: Zero-Touch Deployment

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Test and Deploy to Staging
    runs-on: ubuntu-latest

    environment:
      name: staging

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

    steps:

      # 1. Get the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. Check Terraform formatting
      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check -recursive

      # 4. Initialize Terraform without using AWS backend
      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false

      # 5. Check Terraform configuration
      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      # 6. Install TFLint
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

      # 7. Initialize TFLint
      - name: Initialize TFLint
        working-directory: terraform
        run: tflint --init

      # 8. Run TFLint
      - name: Run TFLint
        working-directory: terraform
        run: tflint --recursive

      # 9. Install Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 10. Install application dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest

      # 11. Run tests
      - name: Run application tests
        run: |
          python -m pytest app/tests -v

      # 12. Configure AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Staging

      # 13. Check which AWS identity GitHub received
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # 14. Login to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 15. Build and push Docker image
      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build -t "$IMAGE" ./app
          docker push "$IMAGE"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # 16. Save the current working task definition
      - name: Get current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition \
            > task-definition.json

      # 17. Replace the Nginx image with our Flask image
      - name: Render new task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: app
          image: ${{ steps.build-image.outputs.image }}

      # 18. Deploy to ECS staging
      - name: Deploy to ECS staging
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15

      # 19. Confirm ECS service is stable
      - name: Check ECS deployment
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].{Status:status,Desired:desiredCount,Running:runningCount,Pending:pendingCount}' \
            --output table
